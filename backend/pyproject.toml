[project]
name = "inference-ops-platform-backend"
version = "0.1.0"
description = "FastAPI backend for a real-time inference operations platform."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "opentelemetry-api>=1.25.0",
  "prometheus-client>=0.20.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.3.4",
  "python-dotenv>=1.0.1",
  "redis>=5.0.7",
  "sqlalchemy>=2.0.31",
  "structlog>=24.2.0",
  "uvicorn[standard]>=0.30.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.2",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
